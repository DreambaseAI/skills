name: Publish MCP installer

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: startsWith(github.event.release.tag_name, 'mcp-v')
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org
          cache: pnpm
          cache-dependency-path: packages/mcp-installer/pnpm-lock.yaml
      - name: Verify release tag
        working-directory: packages/mcp-installer
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          test "${GITHUB_REF_NAME}" = "mcp-v${VERSION}"
      - name: Test and publish
        working-directory: packages/mcp-installer
        run: |
          pnpm install --frozen-lockfile
          pnpm sync:skills
          pnpm typecheck
          pnpm lint
          pnpm test
          npm publish --access public --provenance
