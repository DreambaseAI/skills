name: Validate skills library

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run check:skills
      - name: Validate Claude compatibility redirect
        run: npx --yes @anthropic-ai/claude-code@2.1.293 plugin validate .claude-plugin/marketplace.json --strict
